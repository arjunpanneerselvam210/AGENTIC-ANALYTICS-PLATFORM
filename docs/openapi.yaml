          example: Organic Alphonso Mangoes
        category:
          type: string
          title: Category
          description: Product category
          example: Fresh Produce
        revenue:
          type: number
          title: Revenue
          description: Total product gross revenue
          example: 1850000.0
        orders:
          type: integer
          title: Orders
          description: Quantity ordered
          example: 450
        growth:
          type: string
          title: Growth
          description: Period revenue growth rate
          example: +18.4%
        stock:
          type: integer
          title: Stock
          description: Current warehouse quantity on hand
          example: 42
      type: object
      required:
      - id
      - name
      - category
      - revenue
      - orders
      - growth
      - stock
      title: TopProductPoint
      description: Top-selling product performance and warehouse inventory balance.
    TrendSummary:
      properties:
        direction:
          type: string
          title: Direction
          description: 'Directional trend velocity: UPWARD, DOWNWARD, STABLE'
          default: UPWARD
          example: UPWARD
        highest_period:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Highest Period
          description: Peak performing period data point
        lowest_period:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Lowest Period
          description: Lowest performing period data point
        avg_growth_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg Growth Pct
          description: Average period growth rate
          example: 4.2
        summary:
          type: string
          title: Summary
          description: Narrative trend explanation
          default: ''
      type: object
      title: TrendSummary
      description: Time-series directional trend analysis.
    UserCreate:
      properties:
        username:
          type: string
          maxLength: 60
          minLength: 3
          title: Username
          description: Unique username for the new account
          example: anita.finance
        email:
          type: string
          title: Email
          description: Unique email address
          example: anita.f@freshmart.local
        password:
          type: string
          minLength: 6
          title: Password
          description: Initial plain text password (hashed securely with bcrypt)
          example: SecurePass2026!
        full_name:
          type: string
          maxLength: 120
          title: Full Name
          description: Full display name of the user
          example: Anita Sharma
        role_id:
          type: integer
          title: Role Id
          description: 'Role ID to assign to this user (1: ADMIN, 2: CEO, 3: HR_MANAGER,
            4: ERP_MANAGER, 5: SALES_MANAGER, 6: INVENTORY_MANAGER, 7: FINANCE_MANAGER)'
          example: 7
        employee_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Employee Id
          description: Optional MySQL employee ID to associate
          example: E010
      type: object
      required:
      - username
      - email
      - password
      - full_name
      - role_id
      title: UserCreate
      description: Payload to provision a new application user account.
    UserProfile:
      properties:
        user_id:
          type: integer
          title: User Id
          description: Unique integer user identifier
          example: 2
        username:
          type: string
          title: Username
          description: Unique application username
          example: ceo
        email:
          type: string
          title: Email
          description: Corporate email address
          example: ceo@freshmart.local
        full_name:
          type: string
          title: Full Name
          description: User's full name
          example: Vikram Malhotra
        role:
          type: string
          title: Role
          description: Assigned application role name
          example: CEO
        employee_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Employee Id
          description: Linked MySQL workforce employee ID
          example: E006
        permissions:
          items:
            type: string
          type: array
          title: Permissions
          description: List of granular RBAC permission codes granted to this user
          example:
          - VIEW_HR
          - VIEW_EMPLOYEE_SALARY
          - VIEW_CRM
          - VIEW_SALES
          - VIEW_INVENTORY
          - VIEW_PURCHASES
          - VIEW_FINANCE
          - VIEW_PROFIT
          - VIEW_EXPENSES
        is_active:
          type: boolean
          title: Is Active
          description: Account active status flag
          default: true
          example: true
      type: object
      required:
      - user_id
      - username
      - email
      - full_name
      - role
      - permissions
      title: UserProfile
      description: Current authenticated user profile and granted permissions.
    UserResponse:
      properties:
        user_id:
          type: integer
          title: User Id
          description: Unique user identifier
          example: 1
        username:
          type: string
          title: Username
          description: Unique username
          example: admin
        email:
          type: string
          title: Email
          description: Email address
          example: admin@freshmart.local
        full_name:
          type: string
          title: Full Name
          description: Display name
          example: Technical Administrator
        role_id:
          type: integer
          title: Role Id
          description: Foreign key reference to assigned role
          example: 1
        role_name:
          type: string
          title: Role Name
          description: Name of assigned role
          example: ADMIN
        employee_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Employee Id
          description: Linked MySQL workforce ID
        is_active:
          type: boolean
          title: Is Active
          description: Whether user account is active
          example: true
        permissions:
          items:
            type: string
          type: array
          title: Permissions
          description: List of granular permission codes granted via role
          example:
          - MANAGE_USERS
          - MANAGE_ROLES
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Account creation UTC timestamp
      type: object
      required:
      - user_id
      - username
      - email
      - full_name
      - role_id
      - role_name
      - is_active
      - permissions
      - created_at
      title: UserResponse
      description: Detailed user account representation.
    UserRoleUpdate:
      properties:
        role_id:
          type: integer
          title: Role Id
          description: ID of the new role to assign
          example: 5
      type: object
      required:
      - role_id
      title: UserRoleUpdate
      description: Payload to reassign a user's application role.
    UserStatusUpdate:
      properties:
        is_active:
          type: boolean
          title: Is Active
          description: Set true to enable account, false to deactivate account
          example: false
      type: object
      required:
      - is_active
      title: UserStatusUpdate
      description: Payload to activate or deactivate a user account.
    VisualizationHintModel:
      properties:
        type:
          type: string
          title: Type
          description: 'Chart type: line, bar, area, pie, donut, table, kpi'
          default: table
          example: line
        x_axis:
          anyOf:
          - type: string
          - type: 'null'
          title: X Axis
          description: Field name for horizontal X-axis
          example: month
        y_axis:
          anyOf:
          - type: string
          - type: 'null'
          title: Y Axis
          description: Field name for vertical Y-axis
          example: revenue
        series:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Series
          description: Series field names for multi-dimensional comparisons
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
          description: Recommended chart title for dashboard display
          example: 12-Month Sales Velocity
      type: object
      title: VisualizationHintModel
      description: Frontend charting and visualization recommendation.
    LoginRequest:
      description: User login request payload.
      examples:
      - password: CeoPassword123!
        username: ceo
      - password: SalesPassword123!
        username: sales.manager
      - password: HrPassword123!
        username: hr.manager
      - password: AdminPassword123!
        username: admin
      properties:
        username:
          description: Application username (e.g. ceo, sales.manager, admin)
          example: ceo
          title: Username
          type: string
        password:
          description: Application account password
          example: CeoPassword123!
          title: Password
          type: string
      required:
      - username
      - password
      title: LoginRequest
      type: object
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Authorization header using the Bearer scheme. Enter token directly
        or as 'Bearer <token>'.
    OAuth2PasswordBearer:
      type: oauth2
      description: 'OAuth2 Password Flow: Authenticate using username and password'
      flows:
        password:
          scopes: {}
          tokenUrl: /api/v1/auth/login
tags:
- name: Authentication
  description: User authentication, JWT token issuance, session verification, and
    permission introspection.
- name: Agentic Analytics
  description: Natural-language enterprise analytics powered by LangGraph multi-agent
    orchestration and MCP database access.
- name: Executive Dashboard
  description: Deterministic real-time KPI metrics, sales velocity trends, category
    distributions, and business telemetry.
- name: User Management
  description: Administrative endpoints to list, provision, activate, and deactivate
    application users (Requires MANAGE_USERS permission).
- name: Role Management
  description: Administrative endpoints to inspect roles and assign permissions (Requires
    MANAGE_ROLES permission).
- name: AI Chatbot
  description: Role-scoped conversational AI assistant for business guidance and general
    analytics inquiries.
- name: Health & Diagnostics
  description: Liveness probes and diagnostic health checks for FastAPI, Ollama LLM,
    MySQL, and PostgreSQL services.
- name: General
  description: General service metadata and root greeting.
