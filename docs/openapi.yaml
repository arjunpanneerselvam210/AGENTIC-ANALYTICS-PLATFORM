openapi: 3.1.0
info:
  title: FreshMart Agentic Analytics API
  description: "\n# FreshMart Agentic Analytics API\n\nWelcome to the **FreshMart\
    \ Agentic Analytics Platform** enterprise API documentation.\n\nFreshMart Agentic\
    \ Analytics provides secure, AI-powered natural-language analytics for FreshMart\
    \ enterprise business data across retail operations, customer relationship management,\
    \ human resources, inventory warehousing, purchasing, and financial performance.\n\
    \n---\n\n### Core Platform Capabilities\n\n* **AI-Powered Natural-Language Analytics:**\
    \ Inquire in plain English (e.g., *\"Why did profit decrease in August?\"* or\
    \ *\"Show monthly sales trend for the last 12 months\"*).\n* **LangGraph Multi-Agent\
    \ Orchestration:** Specialized agents collaborate autonomously:\n  * **Intent\
    \ Classifier:** Detects analytical goal, business domain, and inquiry category.\n\
    \  * **Permission Checker:** Enforces database table and column-level RBAC prior\
    \ to query generation.\n  * **Schema Planner:** Dynamically inspects schemas using\
    \ the Model Context Protocol (MCP).\n  * **SQL Generator & Corrector:** Synthesizes\
    \ read-only SQL via local `qwen2.5-coder:7b`.\n  * **SQL Validator:** Rigorous\
    \ AST parser preventing non-SELECT, destructive, or unauthorized queries.\n  *\
    \ **SQL Executor:** Safely runs validated SQL through MCP with row bounding and\
    \ timeout limits.\n  * **Investigation Planner & Root-Cause Agent:** Formulates\
    \ diagnostic hypotheses and performs multi-step period-over-period variance decomposition.\n\
    \  * **Business Analyzer & Response Generator:** Grounded narrative synthesis\
    \ powered by `llama3.1:8b`.\n* **Model Context Protocol (MCP) Read-Only Database\
    \ Layer:** Controlled, secure interface ensuring the AI agents only access approved\
    \ business databases with read-only credentials.\n* **Deterministic Executive\
    \ Dashboard:** Direct real-time MySQL executive metrics, KPI cards, sales velocity,\
    \ category distributions, and inventory deficits.\n* **Enterprise Security & RBAC:**\
    \ Authoritative PostgreSQL JWT Bearer authentication with 7 enterprise roles and\
    \ 11 granular permission codes.\n* **Data Provenance & Auditability:** Responses\
    \ include citations of underlying database tables, columns, and metric calculations.\n\
    \n---\n\n### Authentication & Authorization\n\nAll analytics, dashboard, admin,\
    \ and chat endpoints require JWT Bearer authentication:\n1. Obtain an access token\
    \ via `POST /api/v1/auth/login` or click the **Authorize** button in Swagger UI.\n\
    2. Provide the token in the `Authorization` header as: `Bearer <token>`.\n3. The\
    \ platform validates role permissions on every request before any analytical workflow\
    \ or database query is initiated.\n\n---\n\n### Interactive Swagger UI Testing\n\
    \nUse the **Authorize** button above to authenticate with one of the following\
    \ demo credentials:\n* **CEO (Full enterprise access):** `ceo` / `CeoPassword123!`\n\
    * **Sales Manager:** `sales.manager` / `SalesPassword123!`\n* **Finance Manager:**\
    \ `finance.manager` / `FinancePassword123!`\n* **HR Manager:** `hr.manager` /\
    \ `HrPassword123!`\n* **Inventory Manager:** `inventory.manager` / `InventoryPassword123!`\n\
    * **ERP Manager:** `erp.manager` / `ErpPassword123!`\n* **System Administrator:**\
    \ `admin` / `AdminPassword123!`\n"
  contact:
    name: FreshMart Enterprise Analytics Engineering Team
    email: analytics-engineering@freshmart.local
  license:
    name: Proprietary / Enterprise Edition
  version: 1.0.0
paths:
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      summary: Authenticate User & Generate JWT Access Token
      description: 'Authenticates a FreshMart user with username and password, returning
        a signed JWT Bearer access token along with the user profile, role, and granted
        RBAC permission codes.


        **Supported Content-Types:**

        - `application/json`: Standard REST API clients

        - `application/x-www-form-urlencoded`: Interactive Swagger UI Authorize dialog
        and HTML forms


        **Available Demo Accounts (Password: `<Role>Password123!` or `AdminPassword123!`):**

        - `ceo`: Full enterprise analytics access

        - `sales.manager`: Sales, CRM, and inventory analytics

        - `finance.manager`: Financial P&L, expenses, and profit analytics

        - `hr.manager`: HRMS directory and employee salary analytics

        - `inventory.manager`: Products, warehouse stock, and purchasing

        - `erp.manager`: Integrated procurement, stock, sales, and HR

        - `admin`: System administration (user and role management)'
      operationId: loginUser
      requestBody:
        description: FreshMart application credentials submitted as JSON or Form URL-encoded
          data.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              ceo_login:
                summary: CEO Account (Full Access)
                description: Login as CEO with full enterprise-wide visibility.
                value:
                  username: ceo
                  password: CeoPassword123!
              sales_manager_login:
                summary: Sales Manager Account
                description: Login as Sales Manager with sales, CRM, and inventory
                  permissions.
                value:
                  username: sales.manager
                  password: SalesPassword123!
              finance_manager_login:
                summary: Finance Manager Account
                description: Login as Finance Manager with P&L, profit, and expense
                  access.
                value:
                  username: finance.manager
                  password: FinancePassword123!
              hr_manager_login:
                summary: HR Manager Account
                description: Login as HR Manager with employee salary inspection rights.
                value:
                  username: hr.manager
                  password: HrPassword123!
              admin_login:
                summary: System Administrator
                description: Login as Technical Administrator for user and role management.
                value:
                  username: admin
                  password: AdminPassword123!
          application/x-www-form-urlencoded:
            schema:
              properties:
                username:
                  type: string
                  description: Application username (e.g., ceo, sales.manager, admin)
                  example: ceo
                password:
                  type: string
                  format: password
                  description: Application password
                  example: CeoPassword123!
                grant_type:
                  type: string
                  default: password
              type: object
              required:
              - username
              - password
        required: true
      responses:
        '200':
          description: User successfully authenticated. JWT access token and user
            profile returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: 'Bad Request: Missing username or password, or malformed request
            payload.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '401':
          description: 'Unauthorized: Incorrect username or password.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '403':
          description: 'Forbidden: User account is inactive or disabled by system
            administrator.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          description: 'Validation Error: Request payload could not be processed.'
  /api/v1/auth/me:
    get:
      tags:
      - Authentication
      summary: Get Current Authenticated User Profile
      description: Returns profile information, role metadata, and granted RBAC permission
        codes for the currently authenticated user identified by the verified JWT
        access token.
      operationId: getCurrentUserProfile
      responses:
        '200':
          description: User profile and granted permissions successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: 'Unauthorized: Missing, invalid, or expired JWT access token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '403':
          description: 'Forbidden: User account is inactive or disabled.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
      security:
      - bearerAuth: []
      - OAuth2PasswordBearer: []
  /api/v1/admin/users:
    get:
      tags:
      - User Management
      summary: List All Registered Application Users
      description: 'Retrieves a complete list of all FreshMart application user accounts,
        including their assigned role, granted permission codes, workforce employee
        linkage, and active status.


        **Authorization:** Requires `MANAGE_USERS` permission (granted to `ADMIN`).'
      operationId: listAllApplicationUsers
      responses:
        '200':
          description: List of all user accounts successfully retrieved.
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/UserResponse'
                type: array
                title: Response 200 Listallapplicationusers
        '401':
          description: 'Unauthorized: Missing, invalid, or expired JWT access token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '403':
          description: 'Forbidden: User lacks the required ''MANAGE_USERS'' permission.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
      security:
      - bearerAuth: []
      - OAuth2PasswordBearer: []
    post:
      tags:
      - User Management
      summary: Provision New Application User Account
      description: 'Provisions a new FreshMart user account with secure bcrypt password
        hashing and associates it with an existing application role.


        **Authorization:** Requires `MANAGE_USERS` permission (granted to `ADMIN`).'
      operationId: createApplicationUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      responses:
        '201':
          description: User account created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: 'Bad Request: Username or email already exists in system.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '401':
          description: 'Unauthorized: Missing, invalid, or expired JWT access token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '403':
          description: 'Forbidden: User lacks the required ''MANAGE_USERS'' permission.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '404':
          description: 'Not Found: The specified role_id does not exist.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          description: 'Validation Error: Invalid payload attributes.'
      security:
      - bearerAuth: []
      - OAuth2PasswordBearer: []
  /api/v1/admin/users/{user_id}/status:
    patch:
      tags:
      - User Management
      summary: Activate or Deactivate User Account
      description: 'Enables or disables an application user account. Deactivated accounts
        are immediately blocked from logging in and their active JWT sessions are
        rejected at the authentication barrier.


        **Authorization:** Requires `MANAGE_USERS` permission (granted to `ADMIN`).'
      operationId: updateUserAccountStatus
      security:
      - bearerAuth: []
      - OAuth2PasswordBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserStatusUpdate'
      responses:
        '200':
          description: User account status updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: 'Unauthorized: Missing, invalid, or expired JWT access token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '403':
          description: 'Forbidden: User lacks the required ''MANAGE_USERS'' permission.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '404':
          description: 'Not Found: User with specified user_id not found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          description: 'Validation Error: Invalid user_id or payload.'
  /api/v1/admin/users/{user_id}/role:
    patch:
      tags:
      - User Management
      summary: Change User Application Role & Privileges
      description: 'Reassigns a user''s application role, dynamically changing their
        granted RBAC permission codes and data domain access across the platform.


        **Authorization:** Requires `MANAGE_ROLES` permission (granted to `ADMIN`).'
      operationId: updateUserApplicationRole
      security:
      - bearerAuth: []
      - OAuth2PasswordBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRoleUpdate'
      responses:
        '200':
          description: User role updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: 'Unauthorized: Missing, invalid, or expired JWT access token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '403':
          description: 'Forbidden: User lacks the required ''MANAGE_ROLES'' permission.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '404':
          description: 'Not Found: User or Role ID not found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          description: 'Validation Error: Invalid user_id or role_id.'
  /api/v1/admin/roles:
    get:
      tags:
      - Role Management
      summary: List Application Roles & Granted Permission Codes
      description: 'Returns all 7 FreshMart application roles (ADMIN, CEO, HR_MANAGER,
        ERP_MANAGER, SALES_MANAGER, INVENTORY_MANAGER, FINANCE_MANAGER) along with
        their granular permission codes.


        **Authorization:** Requires `MANAGE_ROLES` permission (granted to `ADMIN`).'
      operationId: listApplicationRolesAndPermissions
      responses:
        '200':
          description: Roles and assigned permission codes successfully retrieved.
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/RoleResponse'
                type: array
                title: Response 200 Listapplicationrolesandpermissions
        '401':
          description: 'Unauthorized: Missing, invalid, or expired JWT access token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '403':
          description: 'Forbidden: User lacks the required ''MANAGE_ROLES'' permission.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
      security:
      - bearerAuth: []
      - OAuth2PasswordBearer: []
  /api/v1/chat/message:
    post:
      tags:
      - AI Chatbot
      summary: Send Conversational Business Inquiry
      description: 'Role-scoped conversational AI chat endpoint powered by Ollama
        Llama 3.1 8B:

        1. Authenticates user identity and role from backend JWT.

        2. Injects authoritative system context with permitted business domains.

        3. Queries local Ollama LLM with role-scoped context.

        4. Returns AI response with role and permitted domain metadata.'
      operationId: sendChatMessage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMessageRequest'
        required: true
      responses:
        '200':
          description: Conversational assistant response generated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessageResponse'
        '401':
          description: 'Unauthorized: Missing, invalid, or expired JWT access token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          description: 'Validation Error: Request message payload could not be validated.'
        '503':
          description: 'Service Unavailable: Local Ollama LLM engine is offline or
            unreachable.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
      security:
      - bearerAuth: []
      - OAuth2PasswordBearer: []
  /api/v1/analytics/query:
    post:
      tags:
      - Agentic Analytics
      summary: Run Natural-Language Business Analytics Query
      description: 'Accepts a natural-language business analytics question and processes
        it through the authenticated LangGraph multi-agent pipeline with Model Context
        Protocol (MCP) database access.


        ### Processing Workflow:

        1. **Identity & RBAC Verification:** Authenticates user identity and enforces
        domain permissions (e.g., `VIEW_SALES`, `VIEW_INVENTORY`, `VIEW_FINANCE`,
        `VIEW_EMPLOYEE_SALARY`). Unauthorized inquiries are immediately rejected with
        HTTP 403 Forbidden before reaching AI or database layers.

        2. **Dynamic Schema Discovery:** Queries FreshMart database schema through
        MCP `describe_table` tool.

        3. **Read-Only SQL Generation:** Local Qwen 2.5-Coder model synthesizes precision
        analytical SQL.

        4. **Security Validation:** AST parser and regex validator reject non-SELECT,
        destructive, or unauthorized SQL.

        5. **MCP Tool Execution:** Executes SQL strictly through read-only MCP database
        interface with row bounds.

        6. **Multi-Agent Synthesis:** Llama 3.1 8B synthesizes grounded executive
        answers, calculates root-cause factors (for variance inquiries), extracts
        data provenance citations, and recommends chart visualization types.'
      operationId: runNaturalLanguageAnalyticsQuery
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsQueryRequest'
            examples:
              sales_trend:
                summary: Sales Trend (12 Months)
                description: Analyzes historical sales orders and returns monthly
                  revenue velocity.
                value:
                  question: Show monthly sales trend for the last 12 months.
              low_stock:
                summary: Inventory Status (Low Stock)
                description: Inspects warehouse inventory levels below product reorder
                  thresholds.
                value:
                  question: Which products are currently low in stock?
              cross_domain:
                summary: Cross-Domain (Revenue + Inventory)
                description: Combines sales order line items with inventory balances
                  across business databases.
                value:
                  question: Which products generated the highest revenue and are currently
                    low in stock?
              root_cause:
                summary: Root-Cause Analysis (August Profit Drop)
                description: Multi-agent causal diagnostic tracing net margin compression
                  in August 2026 to emergency freight and produce inflation.
                value:
                  question: Why did profit decrease in August?
              hrms_salary:
                summary: HRMS (Salaries by Department)
                description: Workforce analysis calculating department compensation
                  (Requires VIEW_EMPLOYEE_SALARY).
                value:
                  question: Show average employee salary by department.
        required: true
      responses:
        '200':
          description: Natural-language query successfully planned, executed, and
            synthesized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsQueryResponse'
        '400':
          description: 'Bad Request: Empty question, invalid parameters, or question
            too short.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '401':
          description: 'Unauthorized: Missing, invalid, or expired JWT access token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '403':
          description: 'Forbidden: Access Denied due to insufficient RBAC domain permissions
            (e.g. attempting to view employee salary without VIEW_EMPLOYEE_SALARY).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          description: 'Validation Error: Request payload failed schema validation.'
        '500':
          description: 'Internal Server Error: Pipeline execution or SQL synthesis
            failed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
      security:
      - bearerAuth: []
      - OAuth2PasswordBearer: []
  /api/v1/analytics/dashboard:
    get:
      tags:
      - Executive Dashboard
      summary: Get Executive Dashboard KPIs & Sales Velocity Trends
      description: 'Returns live, deterministic FreshMart executive metrics queried
        directly from the MySQL enterprise database:

        - **Executive KPI Cards:** Total Revenue, Customers, Orders, Active Employees
        with period comparison percentages.

        - **12-Month Sales Velocity:** Monthly historical revenue and order volume
        trends.

        - **Category Distribution:** Revenue breakdown across retail catalog categories.

        - **Top Performing SKUs:** High-velocity products with active warehouse stock
        balances.

        - **Telemetry Insights:** Grounded alerts on inventory reorder levels and
        financial variances.'
      operationId: getExecutiveDashboardMetrics
      security:
      - bearerAuth: []
      - OAuth2PasswordBearer: []
      parameters:
      - name: range
        in: query
        required: false
        schema:
          type: string
          pattern: ^(today|7d|30d|90d|12m|custom)$
          description: 'Date range filter window: today, 7d, 30d, 90d, 12m'
          default: 12m
          title: Range
        description: 'Date range filter window: today, 7d, 30d, 90d, 12m'
        example: 12m
      responses:
        '200':
          description: Executive dashboard metrics calculated and returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '401':
          description: 'Unauthorized: Missing, invalid, or expired JWT access token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          description: 'Validation Error: Invalid date range filter parameter.'
  /api/v1/analytics/insights:
    get:
      tags:
      - Executive Dashboard
      summary: Get Enterprise Insights, Anomalies & Strategic Recommendations
      description: 'Returns live structured FreshMart enterprise insights, anomalies,
        and recommendations strictly grounded in MySQL ledger data for the Insights
        dashboard.


        Includes automated detection of the August 2026 profit contraction, emergency
        air freight spikes, and warehouse safety stock deficit alerts.'
      operationId: getEnterpriseInsightsAndAnomalies
      responses:
        '200':
          description: Enterprise insights, statistical anomalies, and recommendations
            retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnterpriseInsightsResponse'
        '401':
          description: 'Unauthorized: Missing, invalid, or expired JWT access token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
      security:
      - bearerAuth: []
      - OAuth2PasswordBearer: []
  /:
    get:
      tags:
      - General
      summary: API Welcome & Service Metadata
      description: Returns basic application metadata, active environment, and links
        to documentation.
      operationId: getRootServiceInfo
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /health:
    get:
      tags:
      - Health & Diagnostics
      summary: API Health Check (Liveness Probe)
      description: Lightweight liveness probe endpoint returning basic operational
        status.
      operationId: getLivenessHealthCheck
      responses:
        '200':
          description: API is online and accepting connections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthSimpleResponse'
  /api/v1/health:
    get:
      tags:
      - Health & Diagnostics
      summary: Detailed System & Services Diagnostic Check
      description: 'Performs real-time connectivity and readiness diagnostics across
        all FreshMart backend dependencies:

        - FastAPI Web Server

        - Ollama LLM Service & Required Models (`llama3.1:8b`, `qwen2.5-coder:7b`)

        - FreshMart MySQL Business Database

        - PostgreSQL Authentication Database'
      operationId: getDetailedSystemHealthCheck
      responses:
        '200':
          description: Complete service diagnostic report returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDetailedResponse'
components:
  schemas:
    ActionableRecommendation:
      properties:
        title:
          type: string
          title: Title
          description: Recommendation action title
          example: Emergency Freight Cost Controls
        reason:
          type: string
          title: Reason
          description: Underlying business justification grounded in telemetry
        priority:
          type: string
          title: Priority
          description: 'Execution priority: HIGH, MEDIUM, LOW'
          default: HIGH
          example: HIGH
        related_domain:
          type: string
          title: Related Domain
          description: Business operational domain
          example: Finance
        suggested_action:
          type: string
          title: Suggested Action
          description: Specific operational action recommended for leadership
      type: object
      required:
      - title
      - reason
      - related_domain
      - suggested_action
      title: ActionableRecommendation
      description: Targeted actionable recommendation synthesized by business agents.
    AnalyticsDataPayload:
      properties:
        columns:
          items:
            type: string
          type: array
          title: Columns
          description: List of column names returned by query
          example:
          - month
          - revenue
          - orders
        rows:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Rows
          description: List of row objects mapping column name to value
        row_count:
          type: integer
          title: Row Count
          description: Total number of records returned
          default: 0
          example: 12
        truncated:
          type: boolean
          title: Truncated
          description: Flag indicating if results were capped by safety limit
          default: false
          example: false
      type: object
      title: AnalyticsDataPayload
      description: Tabular database query result payload.
    AnalyticsQueryRequest:
      properties:
        question:
          type: string
          maxLength: 2000
          minLength: 1
          title: Question
          description: Natural-language business analytics question.
          example: Show monthly sales trend for the last 12 months.
        conversation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Conversation Id
          description: Optional conversation session ID for contextual conversational
            memory across turns.
          example: session-marketing-01
      type: object
      required:
      - question
      title: AnalyticsQueryRequest
      description: Natural-language business question submitted to the multi-agent
        analytics pipeline.
      examples:
      - question: Show monthly sales trend for the last 12 months.
      - question: Which products are currently low in stock?
      - question: Which products generated the highest revenue and are currently low
          in stock?
      - question: Why did profit decrease in August?
      - question: Show average employee salary by department.
    AnalyticsQueryResponse:
      properties:
        success:
          type: boolean
